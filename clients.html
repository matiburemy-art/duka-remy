<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients - DUKA PRO</title>
<style>
*{box-sizing:border-box}
body{font-family:Inter,Arial;background:#f1f5f9;padding:16px;margin:0;color:#0f172a}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 18px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.06);margin-bottom:14px}
.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #f8fafc}
.form-add{display:flex;gap:10px;flex-wrap:wrap}
.form-add input{flex:1;min-width:110px;padding:12px 14px;border:1.6px solid #e2e8f0;border-radius:10px;font-weight:600;outline:none}
.form-add input:focus{border-color:#0f172a}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
th{padding:13px 12px;text-align:left;font-size:11px;font-weight:800;letter-spacing:0.8px;color:#64748b;background:#f8fafc}
td{padding:13px 12px;text-align:left;font-size:13px;border-top:1px solid #f8fafc;vertical-align:middle}
.badge-nom{font-weight:800;font-size:14px}
.badge-phone{color:#64748b;font-size:11px}
.badge-dette{background:#fef2f2;color:#dc2626;padding:6px 12px;border-radius:20px;font-weight:900}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* WHATSAPP - LAISSÉ COMME TU AS DEMANDÉ */
.btn-wa{
  background:linear-gradient(135deg,#25D366 0%,#128C7E 100%);
  color:#fff;
  padding:7px 12px;
  border-radius:20px;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:5px;
  box-shadow:0 2px 6px rgba(37,211,102,0.4);
  transition:0.2s;
}
.btn-wa:hover{transform:scale(1.05);box-shadow:0 4px 10px rgba(37,211,102,0.6)}

/* AUTRES BOUTONS REDESIGN PRO */
.btn-edit{background:#eff6ff;color:#1e40af;padding:7px 12px;border-radius:20px;text-decoration:none;font-weight:800;border:1px solid #dbeafe}
.btn-del{background:#fef2f2;color:#991b1b;padding:7px 12px;border-radius:20px;text-decoration:none;font-weight:800;border:1px solid #fee2e2}
.btn-pay{background:#0f172a;color:#fff;border:none;cursor:pointer;padding:8px 14px;border-radius:20px;font-weight:800;box-shadow:0 3px 10px rgba(15,23,42,0.2)}
.pay-input{width:70px!important;padding:8px 10px!important;border-radius:20px!important;text-align:center;font-weight:800}
</style>
</head>
<body>
<div class="topbar">
<a href="/" style="text-decoration:none;font-weight:800;color:#0f172a">← Dashboard</a>
<h2 style="margin:0">👥 Clients Dettes</h2>
</div>

<form method="POST" action="/clients" class="form-add card">
<input name="nom" placeholder="Nom client" required>
<input name="telephone" placeholder="Téléphone 257...">
<input name="dette" type="number" placeholder="Dette 0" value="0">
<button type="submit" style="background:#0f172a;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer">+ Ajouter</button>
</form>

<table>
<tr style="background:#f8fafc"><th>NOM</th><th>DETTE</th><th>ACTIONS</th></tr>
{% for c in clients %}
<tr>
<td><span class="badge-nom">{{c.nom}}</span><br><small class="badge-phone">{{c.telephone}}</small></td>
<td><span class="badge-dette">{{c.dette_totale}} FBU</span></td>
<td>
<div class="row-actions">
  {% if c.telephone %}
  <a class="btn-wa" href="https://wa.me/{{c.telephone}}?text=Bonjour%20{{c.nom}}%20%F0%9F%91%8B%2C%20tu%20as%20une%20dette%20de%20{{c.dette_totale}}%20FBU%20chez%20DUKA%20PRO.%20Merci%20de%20passer%20r%C3%A9gler%20%F0%9F%99%8F" target="_blank">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.14 2 11.82c0 1.92.5 3.79 1.45 5.44L2 22l4.92-1.28c1.57.86 3.34 1.31 5.08 1.31 5.52 0 10-4.14 10-9.21S17.52 2 12 2zm5.6 13.2c-.25.7-1.46 1.35-2.03 1.44-.54.08-1.07.07-1.78-.15-.6-.19-1.37-.52-2.35-1.02-2.08-1.08-3.43-3.01-3.54-3.15-.11-.14-.88-1.17-.88-2.23s.56-1.58.76-1.8c.2-.22.44-.27.59-.27h.42c.13 0 .31-.05.48.36.17.42.58 1.44.63 1.55.05.1.08.22.02.35-.06.13-.09.22-.18.34-.09.12-.19.25-.27.34-.09.09-.18.19-.08.37.1.18.45.74.96 1.2.66.59 1.21.77 1.38.86.17.09.27.08.37-.05.1-.13.43-.5.54-.67.11-.17.22-.14.37-.08.15.05.96.45 1.12.53.17.08.28.12.32.19.04.07.04.4-.21 1.1z"/></svg>
    WhatsApp
  </a>
  {% endif %}
  <a class="btn-edit" href="/clients/edit/{{c.id}}">✏️</a>
  <a class="btn-del" href="/clients/delete/{{c.id}}" onclick="return confirm('Supprimer {{c.nom}}?')">🗑️</a>
  <form method="POST" action="/clients/payer/{{c.id}}" style="display:inline-flex;gap:4px">
    <input name="montant" type="number" placeholder="Paye" class="pay-input" required>
    <button class="btn-pay">💰</button>
  </form>
</div>
</td>
</tr>
{% endfor %}
</table>
</body>
</html>
