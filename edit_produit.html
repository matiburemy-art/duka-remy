<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modifier - DUKA PRO</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px;margin:0}
.card{background:#fff;padding:25px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 4px 15px #0001}
input{width:100%;padding:12px;margin:8px 0;border:1.8px solid #e2e8f0;border-radius:9px;box-sizing:border-box}
label{font-size:12px;color:#64748b;font-weight:700;margin-top:10px;display:block}
.btn{width:100%;background:#0f172a;color:#fff;padding:14px;border:none;border-radius:9px;font-weight:800;margin-top:15px;cursor:pointer}
.btn2{width:100%;background:#f1f5f9;color:#0f172a;padding:14px;border:none;border-radius:9px;font-weight:700;margin-top:8px;text-align:center;display:block;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h2>✏️ Modifier {{ p.nom }}</h2>
<form method="POST">
  <label>Nom Produit</label>
  <input name="nom" value="{{ p.nom }}" required>
  <label>Code Barre</label>
  <input name="code" value="{{ p.code_barre or '' }}">
  <label>Prix Achat</label>
  <input name="achat" type="number" value="{{ p.prix_achat }}" required>
  <label>Prix Vente</label>
  <input name="vente" type="number" value="{{ p.prix_vente }}" required>
  <label>Stock actuel</label>
  <input name="stock" type="number" value="{{ p.stock }}" required>
  <label>Stock Minimum (alerte)</label>
  <input name="min" type="number" value="{{ p.stock_min }}" required>
  <button class="btn" type="submit">💾 Enregistrer Modifications</button>
  <a class="btn2" href="/stock">Annuler</a>
</form>
</div>
</body>
</html>
