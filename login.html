<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connexion - DUKA PRO</title>
<style>
body{font-family:Arial;background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#fff;padding:30px;border-radius:18px;width:90%;max-width:350px;box-shadow:0 10px 30px #0005}
input{width:100%;padding:14px;margin:10px 0;border:1.8px solid #e2e8f0;border-radius:10px;box-sizing:border-box}
button{width:100%;background:#0f172a;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.flash{padding:10px;border-radius:8px;margin-bottom:10px;background:#fee2e2;color:#991b1b;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center;margin:0">🔐 DUKA PRO</h2>
<p style="text-align:center;color:#64748b;font-size:13px">Connecte-toi</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}{% for cat, msg in messages %}<div class="flash">{{msg}}</div>{% endfor %}{% endif %}
{% endwith %}

<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Connexion</button>
</form>
</div>
</body>
</html>
